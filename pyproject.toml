[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black[jupyter]>=23.7.0,<=26.10.1",
    "codespell[toml]>=v2.2.6",
    "fastembed>=0.6.0",
    "jupyter>=1.0.0,<2",
    "mypy>=1.11",
    "nbconvert>=7",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.11",
]

[project]
name = "llama-index-vector-stores-topk"
version = "0.1.0"
description = "llama-index vector_stores topk integration: server-side semantic search, BM25, dense, sparse and multi-vector search, and true hybrid search in one query."
authors = [{name = "TopK Team", email = "support@topk.io"}]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "llama-index",
    "llamaindex",
    "topk",
    "vector store",
    "semantic search",
    "hybrid search",
    "bm25",
    "sparse vectors",
    "splade",
    "multi-vector",
    "colbert",
    "rag",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "topk-sdk>=0.16.0,<1.0.0",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.6.0"]

[project.urls]
Homepage = "https://topk.io"
Documentation = "https://docs.topk.io"
Console = "https://console.topk.io"
Repository = "https://github.com/topk-io/llama-index-vector-stores-topk"
Issues = "https://github.com/topk-io/llama-index-vector-stores-topk/issues"

[tool.codespell]
check-filenames = true
check-hidden = true
# NIN is LlamaIndex's FilterOperator.NIN (not in).
ignore-words-list = "nin"
skip = "*.csv,*.html,*.json,*.jsonl,*.pdf,*.txt,*.ipynb,*.lock"

[tool.hatch.build.targets.sdist]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]
exclude = ["**/BUILD"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.vector_stores.topk"

[tool.llamahub.class_authors]
TopKVectorStore = "topk-io"

[tool.mypy]
disallow_untyped_defs = true
exclude = ["_static", "build", "examples", "notebooks", "venv"]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:"]
markers = ["asyncio", "integration: live tests against TopK (need TOPK_API_KEY)"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]
